[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "railresilient-jp"
version = "0.1.0"
description = "CPU-first probabilistic railway delay forecasting under unreliable feeds"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "Bala Chandra Sekhar Reddy Moole"}]
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3.1",
  "pyarrow>=18,<24",
  "scikit-learn>=1.5,<1.9",
  "torch==2.10.0",
  "requests>=2.32,<3",
  "psutil>=6,<8",
]

[project.scripts]
railresilient = "railresilient.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/railresilient"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
