<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
<title id="title">R4S-MoE v4 clean benchmark graph</title><desc id="desc">Side-by-side bar charts compare clean WIS and MAE for five fresh v4 variants and the earlier v4 control. Lower is better. One seed.</desc>
