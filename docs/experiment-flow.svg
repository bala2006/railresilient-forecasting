<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="520" viewBox="0 0 1450 520" role="img" aria-labelledby="title desc">
<title id="title">RailResilient experiment and evaluation flow</title>
<desc id="desc">Chronological data flows through training, validation checkpoint selection, calibration, causal corruption, and frozen test scoring.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#607781"/></marker><style>.bg{fill:#f6f8f9}.box{stroke:#bfd0d5;stroke-width:2;rx:16}.title{font:700 30px sans-serif;fill:#172b36}.label{font:700 18px sans-serif;fill:#172b36}.small{font:14px sans-serif;fill:#607781}.tag{font:700 12px sans-serif;letter-spacing:1.4px;fill:#178b87}.arrow{stroke:#607781;stroke-width:3;fill:none;marker-end:url(#arrow)}.warning{font:600 14px sans-serif;fill:#a45b22}</style></defs>
<rect width="1450" height="520" class="bg"/><text x="50" y="55" class="title">One-way evaluation flow: no test leakage</text><text x="52" y="84" class="small">The same chronological and causal protocol is used for the v3 control and five fresh v4 variants</text>
<g transform="translate(40 155)"><rect width="185" height="170" class="box" fill="#eaf3f8"/><text x="92" y="35" text-anchor="middle" class="tag">DATA</text><text x="92" y="78" text-anchor="middle" class="label">Train</text><text x="92" y="108" text-anchor="middle" class="small">2023 months</text><text x="92" y="135" text-anchor="middle" class="small">80k cap</text></g>
<g transform="translate(300 155)"><rect width="185" height="170" class="box" fill="#e6f4f2"/><text x="92" y="35" text-anchor="middle" class="tag">FIT</text><text x="92" y="78" text-anchor="middle" class="label">Supervised</text><text x="92" y="108" text-anchor="middle" class="small">quantile loss</text><text x="92" y="135" text-anchor="middle" class="small">+ router regularizer</text></g>
<g transform="translate(560 155)"><rect width="185" height="170" class="box" fill="#fff5e5"/><text x="92" y="35" text-anchor="middle" class="tag">SELECT</text><text x="92" y="78" text-anchor="middle" class="label">Validation</text><text x="92" y="108" text-anchor="middle" class="small">early stopping</text><text x="92" y="135" text-anchor="middle" class="small">checkpoint choice</text></g>
<g transform="translate(820 155)"><rect width="185" height="170" class="box" fill="#f2edf9"/><text x="92" y="35" text-anchor="middle" class="tag">CALIBRATE</text><text x="92" y="78" text-anchor="middle" class="label">Later validation</text><text x="92" y="108" text-anchor="middle" class="small">static + online</text><text x="92" y="135" text-anchor="middle" class="small">thresholds frozen</text></g>
<g transform="translate(1080 155)"><rect width="185" height="170" class="box" fill="#f9eee9"/><text x="92" y="35" text-anchor="middle" class="tag">TEST</text><text x="92" y="78" text-anchor="middle" class="label">2025 months</text><text x="92" y="108" text-anchor="middle" class="small">30k cap</text><text x="92" y="135" text-anchor="middle" class="small">targets scored once</text></g>
<g transform="translate(1340 155)"><rect width="85" height="170" class="box" fill="#e6f4f2"/><text x="42" y="35" text-anchor="middle" class="tag">REPORT</text><text x="42" y="87" text-anchor="middle" class="label">MAE</text><text x="42" y="113" text-anchor="middle" class="label">WIS</text><text x="42" y="139" text-anchor="middle" class="label">Brier</text></g>
<path d="M225 240 L300 240" class="arrow"/><path d="M485 240 L560 240" class="arrow"/><path d="M745 240 L820 240" class="arrow"/><path d="M1005 240 L1080 240" class="arrow"/><path d="M1265 240 L1340 240" class="arrow"/>
<path d="M1172 325 C1172 410 650 410 650 325" class="arrow"/><text x="910" y="445" text-anchor="middle" class="warning">Synthetic feed corruption changes context only; it never changes the matured test target.</text>
</svg>
