<rect x="830" y="270" width="42" height="355" class="c1"/><rect x="878" y="272" width="42" height="353" class="c2"/><rect x="926" y="276" width="42" height="349" class="c3"/><rect x="974" y="272" width="42" height="353" class="c4"/><rect x="1022" y="273" width="42" height="352" class="c5"/><text x="947" y="660" text-anchor="middle" class="label">15 min outage</text>
