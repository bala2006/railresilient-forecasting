<rect x="170" y="321" width="42" height="304" class="c1"/><rect x="218" y="320" width="42" height="305" class="c2"/><rect x="266" y="322" width="42" height="303" class="c3"/><rect x="314" y="320" width="42" height="305" class="c4"/><rect x="362" y="321" width="42" height="304" class="c5"/><text x="287" y="660" text-anchor="middle" class="label">15% packet loss</text>
<!-- group 2 -->
<rect x="500" y="311" width="42" height="314" class="c1"/><rect x="548" y="310" width="42" height="315" class="c2"/><rect x="596" y="317" width="42" height="308" class="c3"/><rect x="644" y="310" width="42" height="315" class="c4"/><rect x="692" y="310" width="42" height="315" class="c5"/><text x="617" y="660" text-anchor="middle" class="label">5 min stale feed</text>
