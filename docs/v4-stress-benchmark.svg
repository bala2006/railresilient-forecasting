<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
<title id="title">R4S-MoE v4 stress benchmark graph</title><desc id="desc">Grouped bars compare online WIS across packet loss, stale feed, outage, and combined corruption for five fresh v4 variants. Lower is better.</desc>
<defs><style>.bg{fill:#f6f8f9}.axis{stroke:#607781;stroke-width:2}.grid{stroke:#dbe4e7;stroke-width:1}.title{font:700 29px sans-serif;fill:#172b36}.sub{font:15px sans-serif;fill:#607781}.tick{font:13px sans-serif;fill:#607781}.label{font:13px sans-serif;fill:#172b36}.value{font:700 11px sans-serif;fill:#172b36}.note{font:600 13px sans-serif;fill:#7465a8}.c1{fill:#168a86}.c2{fill:#7465a8}.c3{fill:#d6873c}.c4{fill:#6a8994}.c5{fill:#b65c5c}</style></defs>
<rect width="1500" height="820" class="bg"/><text x="55" y="52" class="title">R4S-MoE v4 stress results</text><text x="57" y="82" class="sub">Online WIS under synthetic feed corruption · one seed · lower is better</text>
<path d="M100 625 H1410 M100 520 H1410 M100 415 H1410 M100 310 H1410 M100 205 H1410" class="grid"/><path d="M100 150 V625 H1410" class="axis"/><text x="72" y="630" class="tick">0</text><text x="60" y="525" class="tick">10</text><text x="60" y="420" class="tick">20</text><text x="60" y="315" class="tick">30</text><text x="60" y="210" class="tick">40</text>
