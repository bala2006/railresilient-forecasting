<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">R3S-MoE architecture</title>
  <desc id="desc">A simple flow diagram from observed train events and feed quality through a dual encoder, shared and routed experts, and probabilistic forecasts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .box{stroke:#334155;stroke-width:2;rx:16;ry:16}.label{font:600 19px sans-serif;fill:#0f172a}.small{font:15px sans-serif;fill:#334155}.title{font:700 28px sans-serif;fill:#0f172a}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="40" y="48" class="title">R3S-MoE: Reliability-gated Residual Selective-State Forecasting</text>
  <rect x="40" y="110" width="215" height="125" class="box" fill="#dbeafe"/>
  <text x="147" y="145" text-anchor="middle" class="label">Observed history</text>
  <text x="147" y="178" text-anchor="middle" class="small">8 past train events</text>
  <text x="147" y="202" text-anchor="middle" class="small">delay + schedule + station</text>
  <rect x="40" y="300" width="215" height="125" class="box" fill="#fef3c7"/>
  <text x="147" y="335" text-anchor="middle" class="label">Feed quality</text>
  <text x="147" y="368" text-anchor="middle" class="small">7 bounded reliability signals</text>
  <text x="147" y="392" text-anchor="middle" class="small">missing, stale, blackout, etc.</text>
  <path d="M255 172 L335 245" class="arrow"/><path d="M255 362 L335 292" class="arrow"/>
  <rect x="335" y="170" width="245" height="180" class="box" fill="#dcfce7"/>
  <text x="457" y="210" text-anchor="middle" class="label">Dual encoder</text>
  <text x="457" y="247" text-anchor="middle" class="small">Local event mixing</text>
  <text x="457" y="274" text-anchor="middle" class="small">Quality-conditioned state</text>
  <text x="457" y="301" text-anchor="middle" class="small">Mask-gated memory</text>
  <path d="M580 260 L665 260" class="arrow"/>
  <rect x="665" y="95" width="220" height="120" class="box" fill="#ede9fe"/>
  <text x="775" y="132" text-anchor="middle" class="label">Shared expert</text>
  <text x="775" y="166" text-anchor="middle" class="small">Common delay dynamics</text>
  <text x="775" y="190" text-anchor="middle" class="small">always active</text>
  <rect x="665" y="330" width="220" height="120" class="box" fill="#fce7f3"/>
  <text x="775" y="367" text-anchor="middle" class="label">Routed adapters</text>
  <text x="775" y="401" text-anchor="middle" class="small">Top-1 residual specialist</text>
  <text x="775" y="425" text-anchor="middle" class="small">reliability gated</text>
  <path d="M580 240 L665 155" class="arrow"/><path d="M580 280 L665 385" class="arrow"/>
  <path d="M885 155 L950 245" class="arrow"/><path d="M885 385 L950 315" class="arrow"/>
  <rect x="950" y="190" width="210" height="165" class="box" fill="#ffedd5"/>
  <text x="1055" y="230" text-anchor="middle" class="label">Forecast head</text>
  <text x="1055" y="267" text-anchor="middle" class="small">Persistence anchor</text>
  <text x="1055" y="294" text-anchor="middle" class="small">Horizon embeddings</text>
  <text x="1055" y="321" text-anchor="middle" class="small">7 monotonic quantiles</text>
  <text x="600" y="510" text-anchor="middle" class="small">Output: uncertainty-aware delay forecasts for the next 4 events</text>
</svg>
