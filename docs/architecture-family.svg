<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">RailResilient model architecture family</title>
<desc id="desc">A visual comparison of persistence, Ridge, Dense, GRU, R2S-MoE v2, R3S-MoE v3, and R4S-MoE v4.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#607781"/></marker><style>
.bg{fill:#f6f8f9}.panel{stroke:#bfd0d5;stroke-width:2;rx:14}.title{font:700 31px sans-serif;fill:#172b36}.subtitle{font:16px sans-serif;fill:#607781}.label{font:700 19px sans-serif;fill:#172b36}.small{font:14px sans-serif;fill:#607781}.tag{font:700 12px sans-serif;letter-spacing:1.4px;fill:#178b87}.arrow{stroke:#607781;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.route{stroke:#7465a8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.note{font:600 13px sans-serif;fill:#7465a8}
</style></defs>
<rect width="1500" height="1120" class="bg"/>
<text x="55" y="55" class="title">RailResilient model family</text><text x="57" y="84" class="subtitle">From strong simple baselines to reliability-aware sparse mixture-of-experts forecasting</text>
<text x="55" y="125" class="tag">BASELINES</text>
<!-- baseline panels -->
<g transform="translate(45 145)"><rect width="335" height="190" class="panel" fill="#eaf3f8"/><text x="22" y="34" class="tag">PERSISTENCE</text><text x="168" y="78" text-anchor="middle" class="label">Last valid delay</text><path d="M168 90 L168 125" class="arrow"/><text x="168" y="154" text-anchor="middle" class="small">repeat horizon</text><text x="168" y="177" text-anchor="middle" class="small">+ empirical residual quantiles</text></g>
<g transform="translate(405 145)"><rect width="335" height="190" class="panel" fill="#eef5e9"/><text x="22" y="34" class="tag">RIDGE</text><text x="168" y="78" text-anchor="middle" class="label">Feature vector</text><path d="M168 90 L168 125" class="arrow"/><text x="168" y="154" text-anchor="middle" class="small">one Ridge model / horizon</text><text x="168" y="177" text-anchor="middle" class="small">+ validation residual quantiles</text></g>
<g transform="translate(765 145)"><rect width="335" height="190" class="panel" fill="#fff5e5"/><text x="22" y="34" class="tag">DENSE</text><text x="168" y="78" text-anchor="middle" class="label">Encoded history + quality</text><path d="M168 90 L168 125" class="arrow"/><text x="168" y="154" text-anchor="middle" class="small">MLP trunk</text><text x="168" y="177" text-anchor="middle" class="small">→ probabilistic head</text></g>
<g transform="translate(1125 145)"><rect width="335" height="190" class="panel" fill="#f2edf9"/><text x="22" y="34" class="tag">GRU</text><text x="168" y="78" text-anchor="middle" class="label">Event sequence</text><path d="M168 90 L168 125" class="arrow"/><text x="168" y="154" text-anchor="middle" class="small">compact recurrent state</text><text x="168" y="177" text-anchor="middle" class="small">→ probabilistic head</text></g>
<text x="55" y="395" class="tag">MIXTURE-OF-EXPERTS EVOLUTION</text>
<!-- shared input labels -->
<g transform="translate(45 430)"><rect width="220" height="155" class="panel" fill="#eaf3f8"/><text x="110" y="39" text-anchor="middle" class="tag">INPUT</text><text x="110" y="78" text-anchor="middle" class="label">8 events + quality</text><text x="110" y="108" text-anchor="middle" class="small">mask-aware history</text><text x="110" y="132" text-anchor="middle" class="small">seven bounded signals</text></g>
<!-- v2 -->
<g transform="translate(310 410)"><rect width="1115" height="190" class="panel" fill="#f4f8f9"/><text x="25" y="34" class="tag">R2S-MOE V2 · TOP-1</text><rect x="25" y="58" width="230" height="92" class="panel" fill="#e6f4f2"/><text x="140" y="96" text-anchor="middle" class="label">Quality-aware</text><text x="140" y="122" text-anchor="middle" class="small">state encoder</text><path d="M255 104 L330 104" class="arrow"/><rect x="330" y="58" width="200" height="92" class="panel" fill="#fff5e5"/><text x="430" y="96" text-anchor="middle" class="label">Shared</text><text x="430" y="122" text-anchor="middle" class="small">+ 2 adapters</text><path d="M530 104 L610 104" class="route"/><rect x="610" y="58" width="210" height="92" class="panel" fill="#efedf8"/><text x="715" y="96" text-anchor="middle" class="label">Top-1 router</text><text x="715" y="122" text-anchor="middle" class="small">one specialist</text><path d="M820 104 L900 104" class="arrow"/><rect x="900" y="58" width="185" height="92" class="panel" fill="#e6f4f2"/><text x="992" y="96" text-anchor="middle" class="label">Gate</text><text x="992" y="122" text-anchor="middle" class="small">→ quantiles</text><text x="25" y="176" class="note">Reliability redesign: bounded quality and safe missing-context handling</text></g>
<!-- v3 -->
<g transform="translate(310 635)"><rect width="1115" height="190" class="panel" fill="#f4f8f9"/><text x="25" y="34" class="tag">R3S-MOE V3 · TOP-1</text><rect x="25" y="58" width="230" height="92" class="panel" fill="#e6f4f2"/><text x="140" y="96" text-anchor="middle" class="label">Dual encoder</text><text x="140" y="122" text-anchor="middle" class="small">local + state paths</text><path d="M255 104 L330 104" class="arrow"/><rect x="330" y="58" width="200" height="92" class="panel" fill="#fff5e5"/><text x="430" y="96" text-anchor="middle" class="label">Shared</text><text x="430" y="122" text-anchor="middle" class="small">+ 3 adapters</text><path d="M530 104 L610 104" class="route"/><rect x="610" y="58" width="210" height="92" class="panel" fill="#efedf8"/><text x="715" y="96" text-anchor="middle" class="label">Top-1 router</text><text x="715" y="122" text-anchor="middle" class="small">one specialist</text><path d="M820 104 L900 104" class="arrow"/><rect x="900" y="58" width="185" height="92" class="panel" fill="#e6f4f2"/><text x="992" y="96" text-anchor="middle" class="label">Gate</text><text x="992" y="122" text-anchor="middle" class="small">→ quantiles</text><text x="25" y="176" class="note">R3S adds dual-path encoding, residual adapters, and a persistence-anchored quantile head</text></g>
<!-- v4 -->
<g transform="translate(310 860)"><rect width="1115" height="190" class="panel" fill="#f4f8f9"/><text x="25" y="34" class="tag">R4S-MOE V4 · TOP-2</text><rect x="25" y="58" width="230" height="92" class="panel" fill="#e6f4f2"/><text x="140" y="96" text-anchor="middle" class="label">Dual encoder</text><text x="140" y="122" text-anchor="middle" class="small">history + quality</text><path d="M255 104 L330 104" class="arrow"/><rect x="330" y="58" width="200" height="92" class="panel" fill="#fff5e5"/><text x="430" y="96" text-anchor="middle" class="label">Shared</text><text x="430" y="122" text-anchor="middle" class="small">+ 4 adapters</text><path d="M530 104 L610 104" class="route"/><rect x="610" y="58" width="210" height="92" class="panel" fill="#efedf8"/><text x="715" y="96" text-anchor="middle" class="label">Top-2 router</text><text x="715" y="122" text-anchor="middle" class="small">2 of 4 specialists</text><path d="M820 104 L900 104" class="arrow"/><rect x="900" y="58" width="185" height="92" class="panel" fill="#e6f4f2"/><text x="992" y="96" text-anchor="middle" class="label">Gate</text><text x="992" y="122" text-anchor="middle" class="small">→ quantiles</text><text x="25" y="176" class="note">R4S tests whether mixed regimes benefit from two specialists instead of one</text></g>
<path d="M265 507 L310 507" class="arrow"/>
</svg>
